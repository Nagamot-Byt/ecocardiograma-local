name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Ejecutar suite de tests (control de calidad previo al empaquetado)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Construir ejecutable (PyInstaller one-dir)
        run: pyinstaller ecocardiograma.spec --noconfirm --clean

      - name: Instalar Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador (Inno Setup)
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\ecocardiograma.iss'

      - name: Calcular SHA256 del instalador
        shell: pwsh
        run: |
          $f = "dist/installer/EcocardiogramaLocal-Setup-*.exe"
          Get-FileHash $f -Algorithm SHA256 | Format-List
          $hash = (Get-FileHash $f -Algorithm SHA256).Hash
          $name = (Get-Item $f).Name
          "$hash  $name" | Out-File dist/installer/SHA256SUMS.txt -Encoding ascii

      - name: Empaquetar carpeta portable (alternativa sin instalador)
        shell: pwsh
        run: Compress-Archive -Path dist/EcocardiogramaLocal -DestinationPath dist/installer/EcocardiogramaLocal-portable.zip -Force

      - name: Subir artefactos del build
        uses: actions/upload-artifact@v4
        with:
          name: EcocardiogramaLocal-${{ github.ref_name }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/*.zip
          if-no-files-found: error

      - name: Publicar en GitHub Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/EcocardiogramaLocal-Setup-*.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/EcocardiogramaLocal-portable.zip
          generate_release_notes: true
