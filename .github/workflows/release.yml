name: Release (Windows / macOS / Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows
          - os: macos-latest
            id: macos
          - os: ubuntu-22.04 # glibc antigua = compatibilidad con mas distribuciones
            id: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Verificar sincronia de version
        run: python scripts/check_version.py

      - name: Runtime de Qt para tests headless (solo Linux)
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Ejecutar suite de tests (control de calidad previo al empaquetado)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pytest -q

      # ---------------------------------------------------------------------
      # Windows: PyInstaller one-dir + instalador Inno Setup
      # ---------------------------------------------------------------------
      - name: Construir ejecutable (PyInstaller)
        if: matrix.id == 'windows'
        run: pyinstaller ecocardiograma.spec --noconfirm --clean

      - name: Smoke test del binario (Windows)
        if: matrix.id == 'windows'
        shell: bash
        run: bash scripts/smoke_test.sh dist/EcocardiogramaLocal/EcocardiogramaLocal.exe

      - name: Instalar Inno Setup 6
        if: matrix.id == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador (Inno Setup)
        if: matrix.id == 'windows'
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\ecocardiograma.iss'

      - name: Calcular SHA256 y empaquetar portable (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $f = "dist/installer/EcocardiogramaLocal-Setup-*.exe"
          $hash = (Get-FileHash $f -Algorithm SHA256).Hash
          $name = (Get-Item $f).Name
          "$hash  $name" | Out-File dist/installer/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path dist/EcocardiogramaLocal -DestinationPath dist/installer/EcocardiogramaLocal-portable-win64.zip -Force

      # ---------------------------------------------------------------------
      # macOS: bundle .app (sin notarizar; el usuario lo abre con clic derecho)
      # ---------------------------------------------------------------------
      - name: Construir .app (macOS)
        if: matrix.id == 'macos'
        run: pyinstaller ecocardiograma.spec --noconfirm --clean

      - name: Smoke test del binario (macOS)
        if: matrix.id == 'macos'
        shell: bash
        run: bash scripts/smoke_test.sh dist/EcocardiogramaLocal/EcocardiogramaLocal

      - name: Empaquetar .app (macOS)
        if: matrix.id == 'macos'
        run: |
          cd dist
          # xattr -cr: limpia metadatos de quarantine locales; en la copia que
          # descarga el cliente via navegador, Gatekeeper sigue exigiendo
          # clic derecho > Abrir (el .app no esta notarizado sin certificado
          # Apple Developer ID).
          xattr -cr EcocardiogramaLocal.app || true
          ditto -c -k --keepParent EcocardiogramaLocal.app EcocardiogramaLocal-macos.zip
          shasum -a 256 EcocardiogramaLocal-macos.zip > SHA256SUMS-macos.txt

      # ---------------------------------------------------------------------
      # Linux: one-dir portable + lanzador + entrada de menu (.desktop)
      # ---------------------------------------------------------------------
      - name: Construir binarios (Linux)
        if: matrix.id == 'linux'
        run: pyinstaller ecocardiograma.spec --noconfirm --clean

      - name: Smoke test del binario (Linux)
        if: matrix.id == 'linux'
        shell: bash
        run: bash scripts/smoke_test.sh dist/EcocardiogramaLocal/EcocardiogramaLocal

      - name: Empaquetar portable (Linux)
        if: matrix.id == 'linux'
        run: |
          cat > dist/EcocardiogramaLocal/lanzar.sh <<'EOS'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$DIR/EcocardiogramaLocal" "$@"
          EOS
          chmod +x dist/EcocardiogramaLocal/lanzar.sh
          cat > dist/EcocardiogramaLocal/install.sh <<'EIS'
          #!/bin/bash
          # Anhade Ecocardiograma Local al menu de aplicaciones del usuario.
          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          APPS="$HOME/.local/share/applications"
          ICONS="$HOME/.local/share/icons/hicolor/256x256/apps"
          mkdir -p "$APPS" "$ICONS"
          cp "$DIR/ecocardiogramalocal.png" "$ICONS/ecocardiogramalocal.png"
          # Exec con ruta absoluta: el binario no esta en PATH
          sed "s|^Exec=.*|Exec=$DIR/EcocardiogramaLocal|" \
            "$DIR/ecocardiogramalocal.desktop" > "$APPS/ecocardiogramalocal.desktop"
          command -v update-desktop-database >/dev/null 2>&1 && \
            update-desktop-database "$APPS" || true
          echo "Anadido al menu de aplicaciones: Ecocardiograma Local"
          EIS
          chmod +x dist/EcocardiogramaLocal/install.sh
          cat > dist/EcocardiogramaLocal/ecocardiogramalocal.desktop <<'EOD'
          [Desktop Entry]
          Type=Application
          Name=Ecocardiograma Local
          Comment=Informes ecocardiograficos offline (SCC/LATAM)
          Exec=EcocardiogramaLocal
          Icon=ecocardiogramalocal
          Terminal=false
          Categories=MedicalSoftware;Science;
          EOD
          cp assets/app_256.png dist/EcocardiogramaLocal/ecocardiogramalocal.png
          cat > dist/EcocardiogramaLocal/LEEME_LINUX.txt <<'EOT'
          Ecocardiograma Local - Linux (portable)

          1. REQUISITOS DEL SISTEMA
             El binario trae PyQt6/pandas empaquetados, pero necesita fuentes
             de letra y los runtime graficos de Qt. En Debian/Ubuntu:
               sudo apt install fontconfig fonts-dejavu-core libegl1 libgl1 libxkbcommon0
             Sin fuentes instaladas el informe PDF sale con texto vacio
             (el motor QPrinter usa las fuentes del sistema).

          2. ABRIR LA APLICACION
               ./lanzar.sh

          3. ICONO EN EL MENU DE APLICACIONES (opcional)
               ./install.sh
             (copia el acceso directo en ~/.local/share/applications)

          4. IA LOCAL (OPCIONAL)
             Instale Ollama desde https://ollama.com si quiere la extraccion
             automatica con IA; sin ella la aplicacion funciona igual con
             extraccion por reglas.
          EOT
          cd dist
          tar czf EcocardiogramaLocal-linux-x64.tar.gz EcocardiogramaLocal
          sha256sum EcocardiogramaLocal-linux-x64.tar.gz > SHA256SUMS-linux.txt

      # ---------------------------------------------------------------------
      - name: Subir artefactos del build (${{ matrix.id }})
        uses: actions/upload-artifact@v4
        with:
          name: EcocardiogramaLocal-${{ matrix.id }}-${{ github.ref_name }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/*portable-win64.zip
            dist/*.zip
            dist/SHA256SUMS-macos.txt
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Publicar en GitHub Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/EcocardiogramaLocal-Setup-*.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/*portable-win64.zip
            dist/EcocardiogramaLocal-macos.zip
            dist/SHA256SUMS-macos.txt
            dist/EcocardiogramaLocal-linux-x64.tar.gz
            dist/SHA256SUMS-linux.txt
          generate_release_notes: true
