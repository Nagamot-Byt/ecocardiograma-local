[pytest]
testpaths = tests
pythonpath = .
addopts = --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=90

; La configuracion de coverage (source, omit, fail_under) vive en
; pyproject.toml bajo [tool.coverage.*]: coverage.py no lee secciones
; [tool.coverage.*] desde pytest.ini, aqui se ignorarian en silencio.
